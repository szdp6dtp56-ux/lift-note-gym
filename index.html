<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#176b4d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Lift Note — トレーニング記録</title>
  <style>
    :root{--ink:#18221e;--muted:#64716b;--line:#dce3df;--paper:#f7f8f5;--card:#fff;--green:#176b4d;--lime:#d9f04c;--red:#b43e36;--shadow:0 12px 30px rgba(20,42,32,.08)}
    *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;font-size:15px} button,input,textarea,select{font:inherit} button{cursor:pointer}
    .shell{max-width:1120px;margin:auto;padding:28px 24px 56px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}.brand{display:flex;gap:11px;align-items:center;font-size:20px;font-weight:800;letter-spacing:-.04em}.mark{width:32px;height:32px;border-radius:9px;background:var(--green);display:grid;place-items:center;color:var(--lime);font-size:21px}.date{color:var(--muted);font-size:14px}.install-tip{display:none}
    .hero{background:var(--green);color:white;border-radius:24px;padding:30px 34px;position:relative;overflow:hidden;min-height:176px;box-shadow:var(--shadow)}.hero:after{content:"";position:absolute;width:230px;height:230px;border:30px solid var(--lime);opacity:.18;border-radius:50%;right:-55px;top:-82px}.eyebrow{color:var(--lime);font-size:12px;font-weight:800;letter-spacing:.12em}.hero h1{font-size:28px;letter-spacing:-.05em;margin:10px 0 8px}.hero p{margin:0;color:#d7e5de}.hero button{margin-top:20px;background:var(--lime);border:0;border-radius:10px;padding:10px 17px;font-weight:800;color:var(--ink);position:relative;z-index:1}
    .grid{display:grid;grid-template-columns:1.2fr .8fr;gap:22px;margin-top:22px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:23px;box-shadow:0 2px 8px rgba(20,42,32,.025)}h2{font-size:17px;letter-spacing:-.03em;margin:0 0 18px}.section-head{display:flex;align-items:center;justify-content:space-between}.subtle{color:var(--muted);font-size:13px}
    .session{display:flex;align-items:center;gap:13px;padding:14px 0;border-bottom:1px solid var(--line)}.session:last-child{border:0;padding-bottom:0}.session-icon{width:39px;height:39px;display:grid;place-items:center;border-radius:12px;background:#e8f2ed;color:var(--green);font-size:18px}.session-info{flex:1}.session-name{font-weight:750}.session-meta{color:var(--muted);font-size:13px;margin-top:3px}.pill{background:#edf4ef;color:var(--green);padding:5px 9px;border-radius:99px;font-size:12px;font-weight:700}
    .members-header{display:flex;align-items:end;justify-content:space-between;margin:4px 0 18px}.members-header h1{margin:0;font-size:27px;letter-spacing:-.05em}.members-header p{margin:6px 0 0;color:var(--muted)}.member-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.member-card{border:1px solid var(--line);border-radius:15px;background:white;padding:17px;display:flex;align-items:center;gap:13px;text-align:left;transition:.16s;box-shadow:0 2px 8px rgba(20,42,32,.025)}.member-card:hover{border-color:#8aaf9d;transform:translateY(-2px);box-shadow:var(--shadow)}.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--lime);color:var(--ink);font-weight:900;font-size:18px}.member-card .session-info{min-width:0}.member-card .session-name{font-size:16px}.member-arrow{color:var(--green);font-size:22px}.back{border:0;background:transparent;color:var(--green);padding:0;font-weight:800;font-size:14px}.member-title{display:flex;align-items:center;gap:12px;margin-bottom:22px}.member-title h1{margin:0;font-size:25px;letter-spacing:-.05em}.member-title .avatar{width:38px;height:38px;font-size:16px}.hidden{display:none!important}
    .stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{background:#f3f6f3;border-radius:14px;padding:16px}.stat strong{font-size:25px;display:block;letter-spacing:-.05em}.stat span{color:var(--muted);font-size:12px}.empty{color:var(--muted);padding:22px 0;text-align:center}.history{margin-top:22px}.history-item{display:grid;grid-template-columns:84px 1fr auto;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center}.history-item:last-child{border:0}.history-date{font-weight:800;font-size:13px}.history-date small{display:block;color:var(--muted);font-weight:500;margin-top:3px}.exercise-lines{font-size:14px;line-height:1.65}.delete{border:0;background:transparent;color:var(--red);padding:7px;font-size:13px}
    dialog{border:0;border-radius:20px;padding:0;width:min(600px,calc(100% - 30px));box-shadow:0 25px 70px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(10,24,17,.48)}.modal{padding:25px}.modal h2{font-size:22px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}label{font-size:12px;font-weight:750;color:var(--muted)}input,textarea{border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff;color:var(--ink);width:100%}textarea{min-height:72px;resize:vertical}.exercise-row{display:grid;grid-template-columns:1.6fr .7fr .7fr .7fr auto;gap:8px;align-items:end;margin:10px 0}.exercise-row button{background:#fbe9e7;color:var(--red);border:0;border-radius:8px;height:40px;width:38px}.add-exercise{border:1px dashed #9eb5a8;color:var(--green);background:#f8fbf9;border-radius:9px;padding:9px 12px;font-weight:700;margin-top:3px}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:22px}.secondary{background:white;border:1px solid var(--line);padding:10px 15px;border-radius:9px;font-weight:700}.primary{background:var(--green);color:white;border:0;padding:10px 16px;border-radius:9px;font-weight:800}.utility{margin-top:22px;display:flex;gap:9px;flex-wrap:wrap}.utility button,.utility label{background:transparent;border:1px solid var(--line);border-radius:8px;padding:8px 11px;color:var(--muted);font-size:12px;cursor:pointer}.utility input{display:none}
    @media(max-width:720px){.shell{padding:18px 15px 40px}.top{margin-bottom:18px}.date{display:none}.hero{padding:26px 23px}.hero h1{font-size:25px}.grid{grid-template-columns:1fr;gap:15px;margin-top:15px}.card{padding:19px}.exercise-row{grid-template-columns:1.4fr .75fr .75fr .75fr 36px;gap:5px}.exercise-row input{padding:9px 6px;font-size:13px}.history-item{grid-template-columns:68px 1fr auto;gap:8px}.stats{gap:8px}.member-list{grid-template-columns:1fr}.members-header h1{font-size:24px}.install-tip{display:block;background:#edf4ef;border-radius:10px;color:var(--green);font-size:12px;padding:9px 11px;margin-bottom:14px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><div class="brand"><span class="mark">⌁</span>Lift Note</div><div class="date" id="today"></div></header>
    <section id="memberView"><div class="members-header"><div><h1>会員さん</h1><p>会員を選んで記録を確認・追加します。</p></div><button class="primary" id="openMember">＋ 会員を追加</button></div><div class="install-tip">このページをホーム画面に追加すると、アプリのように開けます。</div><div class="member-list" id="memberList"></div><div class="utility"><button id="exportBtn">すべてのデータを書き出す</button><label>データを読み込む<input type="file" id="importFile" accept="application/json"></label><button id="clearBtn">すべて消去</button></div></section>
    <section id="recordView" class="hidden"><button class="back" id="backMembers">← 会員一覧に戻る</button><div class="member-title"><span class="avatar" id="memberAvatar"></span><div><h1 id="memberNameTitle"></h1><span class="subtle" id="memberNote"></span></div></div><section class="hero"><div class="eyebrow">PERSONAL TRAINING LOG</div><h1>今日の頑張りを、次の成長につなげよう。</h1><p>この会員さんの記録を管理しています。</p><button id="openNew">＋ トレーニングを記録</button></section>
    <div class="grid">
      <section class="card"><div class="section-head"><h2>最近のトレーニング</h2><span class="subtle" id="sessionCount"></span></div><div id="recent"></div></section>
      <aside class="card"><h2>今月のサマリー</h2><div class="stats"><div class="stat"><strong id="monthlySessions">0</strong><span>トレーニング回数</span></div><div class="stat"><strong id="monthlySets">0</strong><span>合計セット数</span></div><div class="stat"><strong id="totalSessions">0</strong><span>これまでの記録</span></div><div class="stat"><strong id="favorite">—</strong><span>よく行う種目</span></div></div></aside>
    </div>
    <section class="card history"><div class="section-head"><h2>トレーニング履歴</h2><span class="subtle">新しい順</span></div><div id="history"></div></section></section>
  </main>
  <dialog id="memberDialog"><form class="modal" id="memberForm" method="dialog"><div class="section-head"><h2>会員を追加</h2><button class="delete" type="button" id="closeMemberDialog">閉じる</button></div><div class="field"><label>会員名</label><input id="newMemberName" placeholder="例：田中 花子" required autofocus></div><div class="field" style="margin-top:13px"><label>メモ（任意）</label><input id="newMemberNote" placeholder="例：目標・注意点など"></div><div class="actions"><button type="button" class="secondary" id="cancelMember">キャンセル</button><button class="primary" value="save">追加する</button></div></form></dialog>
  <dialog id="logDialog"><form class="modal" id="logForm" method="dialog"><div class="section-head"><h2>トレーニングを記録</h2><button class="delete" type="button" id="closeDialog">閉じる</button></div><div class="form-grid"><div class="field"><label>日付</label><input type="date" id="workoutDate" required></div><div class="field"><label>トレーニング名（任意）</label><input id="workoutName" placeholder="例：上半身の日"></div><div class="field full"><label>メモ（任意）</label><textarea id="workoutNote" placeholder="体調、フォームの気づきなど"></textarea></div></div><h2 style="margin:23px 0 8px;font-size:16px">種目</h2><div id="exerciseRows"></div><button type="button" class="add-exercise" id="addExercise">＋ 種目を追加</button><div class="actions"><button type="button" class="secondary" id="cancel">キャンセル</button><button class="primary" value="save">保存する</button></div></form></dialog>
  <template id="exerciseTemplate"><div class="exercise-row"><div class="field"><label>種目名</label><input class="exercise-name" placeholder="例：ベンチプレス" required></div><div class="field"><label>重量 kg</label><input class="exercise-weight" type="number" min="0" step="0.5" placeholder="60"></div><div class="field"><label>回数</label><input class="exercise-reps" type="number" min="0" placeholder="10"></div><div class="field"><label>セット</label><input class="exercise-sets" type="number" min="1" value="3" required></div><button type="button" class="remove-exercise" aria-label="種目を削除">×</button></div></template>
  <script>
    const key='lift-note-members-v2', oldKey='lift-note-records-v1'; let data={members:[],records:[]},activeMemberId=null;
    const fmt=new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'});
    const todayISO=()=>new Date().toISOString().slice(0,10);
    const esc=s=>String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    function load(){try{data=JSON.parse(localStorage.getItem(key)||'null')}catch{} if(!data||!Array.isArray(data.members)){let old=[];try{old=JSON.parse(localStorage.getItem(oldKey)||'[]')}catch{};let member={id:'self',name:'自分',note:''};data={members:old.length?[member]:[],records:old.map(r=>({...r,memberId:'self'}))};localStorage.setItem(key,JSON.stringify(data))}renderMembers()}
    function save(){localStorage.setItem(key,JSON.stringify(data));renderMembers();if(activeMemberId)render()}
    function prettyDate(d){const x=new Date(d+'T00:00:00');return {main:x.toLocaleDateString('ja-JP',{month:'numeric',day:'numeric'}),sub:x.toLocaleDateString('ja-JP',{weekday:'short'})}}
    function exerciseText(e){return `${esc(e.name)}${e.weight!==''&&e.weight!=null?' '+esc(e.weight)+'kg':''}${e.reps!==''&&e.reps!=null?' × '+esc(e.reps)+'回':''} × ${esc(e.sets)}セット`}
    const activeRecords=()=>data.records.filter(r=>r.memberId===activeMemberId);
    function renderMembers(){let el=document.querySelector('#memberList');if(!data.members.length){el.innerHTML='<div class="empty">会員がまだ登録されていません。<br>「会員を追加」から始めましょう。</div>';return}el.innerHTML=data.members.map(m=>{let count=data.records.filter(r=>r.memberId===m.id).length;return `<button class="member-card" onclick="selectMember('${m.id}')"><span class="avatar">${esc(m.name.slice(0,1))}</span><span class="session-info"><span class="session-name">${esc(m.name)}</span><span class="session-meta">${count?`トレーニング ${count} 件`:'まだ記録はありません'}${m.note?' · '+esc(m.note):''}</span></span><span class="member-arrow">›</span></button>`}).join('')}
    window.selectMember=id=>{activeMemberId=id;let m=data.members.find(x=>x.id===id);document.querySelector('#memberView').classList.add('hidden');document.querySelector('#recordView').classList.remove('hidden');document.querySelector('#memberNameTitle').textContent=m.name;document.querySelector('#memberNote').textContent=m.note||'トレーニング記録';document.querySelector('#memberAvatar').textContent=m.name.slice(0,1);render()}
    function render(){let records=activeRecords().sort((a,b)=>b.date.localeCompare(a.date));const now=new Date(),month=now.getMonth(),year=now.getFullYear();const monthly=records.filter(r=>{let d=new Date(r.date+'T00:00:00');return d.getMonth()===month&&d.getFullYear()===year});let exerciseNames=records.flatMap(r=>r.exercises.map(e=>e.name)).filter(Boolean), freq={};exerciseNames.forEach(n=>freq[n]=(freq[n]||0)+1);let fav=Object.entries(freq).sort((a,b)=>b[1]-a[1])[0]?.[0]||'—';document.querySelector('#monthlySessions').textContent=monthly.length;document.querySelector('#monthlySets').textContent=monthly.reduce((x,r)=>x+r.exercises.reduce((y,e)=>y+(+e.sets||0),0),0);document.querySelector('#totalSessions').textContent=records.length;document.querySelector('#favorite').textContent=fav.length>8?fav.slice(0,8)+'…':fav;document.querySelector('#sessionCount').textContent=records.length?`全 ${records.length} 件`:'';
      const recent=document.querySelector('#recent'), history=document.querySelector('#history');if(!records.length){recent.innerHTML='<div class="empty">まだ記録がありません。<br>最初のトレーニングを残しましょう。</div>';history.innerHTML='<div class="empty">履歴はここに表示されます。</div>';return}recent.innerHTML=records.slice(0,3).map(r=>{let d=prettyDate(r.date);return `<div class="session"><div class="session-icon">⌁</div><div class="session-info"><div class="session-name">${esc(r.name||'トレーニング')}</div><div class="session-meta">${d.main}（${d.sub}） · ${r.exercises.length}種目</div></div><span class="pill">${r.exercises.reduce((n,e)=>n+(+e.sets||0),0)} sets</span></div>`}).join('');history.innerHTML=records.map((r,i)=>{let d=prettyDate(r.date);return `<div class="history-item"><div class="history-date">${d.main}<small>（${d.sub}）</small></div><div class="exercise-lines"><strong>${esc(r.name||'トレーニング')}</strong><br>${r.exercises.map(exerciseText).join('　／　')}${r.note?`<br><span class="subtle">${esc(r.note)}</span>`:''}</div><button class="delete" onclick="removeRecord(${i})">削除</button></div>`}).join('')}
    window.removeRecord=i=>{let records=activeRecords().sort((a,b)=>b.date.localeCompare(a.date));if(confirm('この記録を削除しますか？')){data.records=data.records.filter(r=>r.id!==records[i].id);save()}}
    const dialog=document.querySelector('#logDialog'), rows=document.querySelector('#exerciseRows');
    function addRow(){rows.append(document.querySelector('#exerciseTemplate').content.cloneNode(true));let row=rows.lastElementChild;row.querySelector('.remove-exercise').onclick=()=>{if(rows.children.length>1)row.remove()}}
    function openLog(){document.querySelector('#workoutDate').value=todayISO();document.querySelector('#workoutName').value='';document.querySelector('#workoutNote').value='';rows.innerHTML='';addRow();dialog.showModal()}
    document.querySelector('#openNew').onclick=openLog;document.querySelector('#addExercise').onclick=addRow;document.querySelector('#closeDialog').onclick=()=>dialog.close();document.querySelector('#cancel').onclick=()=>dialog.close();
    document.querySelector('#logForm').addEventListener('submit',e=>{e.preventDefault();let exercises=[...rows.children].map(row=>({name:row.querySelector('.exercise-name').value.trim(),weight:row.querySelector('.exercise-weight').value,reps:row.querySelector('.exercise-reps').value,sets:row.querySelector('.exercise-sets').value})).filter(e=>e.name);if(!exercises.length)return;data.records.push({id:Date.now(),memberId:activeMemberId,date:document.querySelector('#workoutDate').value,name:document.querySelector('#workoutName').value.trim(),note:document.querySelector('#workoutNote').value.trim(),exercises});save();dialog.close()});
    document.querySelector('#openMember').onclick=()=>document.querySelector('#memberDialog').showModal();document.querySelector('#closeMemberDialog').onclick=()=>document.querySelector('#memberDialog').close();document.querySelector('#cancelMember').onclick=()=>document.querySelector('#memberDialog').close();document.querySelector('#memberForm').onsubmit=e=>{e.preventDefault();let name=document.querySelector('#newMemberName').value.trim();if(!name)return;data.members.push({id:String(Date.now()),name,note:document.querySelector('#newMemberNote').value.trim()});save();document.querySelector('#memberDialog').close();e.target.reset()};document.querySelector('#backMembers').onclick=()=>{activeMemberId=null;document.querySelector('#recordView').classList.add('hidden');document.querySelector('#memberView').classList.remove('hidden');renderMembers()};
    document.querySelector('#exportBtn').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='lift-note-backup.json';a.click();URL.revokeObjectURL(a.href)};
    document.querySelector('#importFile').onchange=e=>{let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let x=JSON.parse(reader.result);if(!Array.isArray(x.members)||!Array.isArray(x.records))throw 0;data=x;save();alert('読み込みました。')}catch{alert('読み込めないデータです。')}};reader.readAsText(f);e.target.value=''};
    document.querySelector('#clearBtn').onclick=()=>{if(confirm('会員とすべての記録をこの端末から消去しますか？')){data={members:[],records:[]};save()}};
    document.querySelector('#today').textContent='今日は '+fmt.format(new Date());if('serviceWorker' in navigator)navigator.serviceWorker.register('./service-worker.js');load();
  </script>
</body></html>
